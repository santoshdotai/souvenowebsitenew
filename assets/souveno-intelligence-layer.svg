<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Souveno Intelligence Layer</title>
  <desc id="desc">Communication, documents, business systems and cameras flowing into the Souveno Intelligence Layer, then becoming actions, alerts, approvals, updates and analytics.</desc>
  <defs>
